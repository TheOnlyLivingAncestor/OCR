apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: ocr-job-creator-binding
  namespace: {{ .Release.Namespace }}
subjects:
  - kind: ServiceAccount
    name: ocr-watcher-sa
    namespace: {{ .Release.Namespace }}
roleRef:
  kind: Role
  name: ocr-job-creator
  apiGroup: rbac.authorization.k8s.io